[project]
name = "django-trusts-example"
version = "0.3.0.dev0"
description = "Runnable Django example that exercises modernized django-trusts"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "django-trusts @ git+https://github.com/django-trusts/django-trusts.git@a2ab5a13752751ee761990bea778c9f868b2ad6e",
    "gunicorn>=23.0.0",
    "PyMySQL[rsa]>=1.2.0",
    "dj-database-url>=2.3.0",
    "whitenoise>=6.9.0",
]

[project.optional-dependencies]
test = []
postgres = ["psycopg[binary]>=3.2"]

[tool.setuptools.packages.find]
include = ["example*", "projects*", "winfs*"]
