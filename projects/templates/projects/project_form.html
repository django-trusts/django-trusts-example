{% extends "base.html" %}
{% block title %}{% if mode == 'edit' %}Edit{% else %}New{% endif %} project{% endblock %}
{% block content %}
<h1>{% if mode == 'edit' %}Edit {{ project.title }}{% else %}Create a project{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">{% if mode == 'edit' %}Save{% else %}Create{% endif %}</button>
</form>
{% endblock %}
